[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "naada"
version = "0.1.0"
description = "The cosmic sound of Carnatic AI — learn, generate, and explore Indian Classical Ragas with deep learning"
authors = [{ name = "Gurumurthy Swaminathan", email = "sgmoorthy@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "carnatic", "music", "raga", "deep-learning", "pytorch",
    "music-information-retrieval", "india", "melakarta", "generative-music", "ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "music21>=9.1.0",
    "librosa>=0.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.scripts]
naada-serve = "app:main"
naada-init-dataset = "data.melakarta_init:main"

[project.urls]
Homepage = "https://sgmoorthy.github.io/naada/"
Repository = "https://github.com/sgmoorthy/naada"
"Bug Tracker" = "https://github.com/sgmoorthy/naada/issues"
"PyPI" = "https://pypi.org/project/naada/"

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
