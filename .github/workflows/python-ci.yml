name: Python CI

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/**'
      - '.github/workflows/python-ci.yml'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check packages/
        
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install hatchling build
          # Install the local packages
          pip install -e packages/deepraaga-core
          pip install -e packages/deepraaga-preprocess
          pip install -e packages/deepraaga-models
          pip install -e packages/deepraaga-api
      - name: Run tests
        run: pytest packages/deepraaga-api/test/ -v --tb=short
