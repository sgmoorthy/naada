name: Build and Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-python:
    name: Python Tests Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install pytest numpy hatchling build
          pip install -e packages/deepraaga-core
          pip install -e packages/deepraaga-preprocess
          pip install -e packages/deepraaga-models
          pip install -e packages/deepraaga-api
      - name: Run tests
        run: pytest packages/deepraaga-api/test/ -v --tb=short

  build-frontend:
    name: Build Frontend
    needs: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_BASE_URL: /naada/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: './frontend/dist'
