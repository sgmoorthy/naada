name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (core, preprocess, models, api, or all)'
        required: true
        default: 'all'

jobs:
  # Build all packages first
  build:
    name: Build Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build packages
        run: |
          python -m build packages/deepraaga-core
          python -m build packages/deepraaga-preprocess
          python -m build packages/deepraaga-models
          python -m build packages/deepraaga-api

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*/dist/*
          retention-days: 1

  # Publish deepraaga-core (no dependencies)
  publish-core:
    name: Publish deepraaga-core to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.package == 'core' || github.event.inputs.package == 'all' || github.event.inputs.package == '' }}
    environment:
      name: pypi
      url: https://pypi.org/p/deepraaga-core
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish deepraaga-core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/deepraaga-core/dist/

  # Publish deepraaga-preprocess (depends on core)
  publish-preprocess:
    name: Publish deepraaga-preprocess to PyPI
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.package == 'preprocess' || github.event.inputs.package == 'all' || github.event.inputs.package == '' }}
    environment:
      name: pypi
      url: https://pypi.org/p/deepraaga-preprocess
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish deepraaga-preprocess to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/deepraaga-preprocess/dist/

  # Publish deepraaga-models (depends on core)
  publish-models:
    name: Publish deepraaga-models to PyPI
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.package == 'models' || github.event.inputs.package == 'all' || github.event.inputs.package == '' }}
    environment:
      name: pypi
      url: https://pypi.org/p/deepraaga-models
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish deepraaga-models to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/deepraaga-models/dist/

  # Publish deepraaga-api (depends on core, optionally models)
  publish-api:
    name: Publish deepraaga-api to PyPI
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.package == 'api' || github.event.inputs.package == 'all' || github.event.inputs.package == '' }}
    environment:
      name: pypi
      url: https://pypi.org/p/deepraaga-api
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish deepraaga-api to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/deepraaga-api/dist/
