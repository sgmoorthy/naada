name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish Python packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          
      - name: Build packages
        run: |
          python -m build packages/deepraaga-core
          python -m build packages/deepraaga-preprocess
          python -m build packages/deepraaga-models
          python -m build packages/deepraaga-api
          
          # Move all wheels and sdists to a common dist directory
          mkdir -p dist
          mv packages/deepraaga-core/dist/* dist/
          mv packages/deepraaga-preprocess/dist/* dist/
          mv packages/deepraaga-models/dist/* dist/
          mv packages/deepraaga-api/dist/* dist/
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If using Trusted Publishing, omit user/password. 
          # If using traditional API tokens, uncomment below:
          # user: __token__
          # password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
