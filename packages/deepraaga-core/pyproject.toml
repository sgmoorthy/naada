[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepraaga-core"
version = "0.1.0"
description = "Core domain models and abstractions for Carnatic music AI. Extracted from the original DeepRaaga project for PyPI."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Surya G", email = "author@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sgmoorthy/DeepRaaga"
Repository = "https://github.com/sgmoorthy/DeepRaaga"
